name: ESPN injury feed check

# Diagnostic only: prints the shape of ESPN's NBA injury feed so the parser can be checked.
# Runs on a push to this branch; no secrets, no Odds API credits.
on:
  push:
    branches: [claude/project-thread-r7nbdp]
    paths: [.github/workflows/espn-injury-check.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and summarize
        run: |
          curl -sS -A "Mozilla/5.0" "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries" -o inj.json
          python3 - <<'PY'
          import json, collections
          js = json.load(open("inj.json"))
          print("top keys:", list(js.keys()))
          teams = js.get("injuries", [])
          print("teams:", len(teams))
          if teams:
              t = teams[0]
              print("team keys:", list(t.keys()))
              its = t.get("injuries", [])
              print("first team injuries:", len(its))
              if its:
                  print(json.dumps(its[0], indent=1)[:2500])
          st = collections.Counter()
          ids = 0
          for t in teams:
              for it in t.get("injuries", []):
                  st[repr(it.get("status"))] += 1
                  if (it.get("athlete") or {}).get("id"): ids += 1
          print("status counts:", st.most_common())
          print("entries with athlete.id:", ids)
          PY
