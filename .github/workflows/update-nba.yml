name: Update NBA and college boards

# Daily projections during the season (about 11 AM and 5 PM New York time), the full backtests on Mondays.
# College runs November to April.
on:
  schedule:
    - cron: "7 16 * 10-12,1-6 *"
    - cron: "7 22 * 10-12,1-6 *"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Rerun the full backtest"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-nba
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: hoopr-${{ github.run_id }}
          restore-keys: hoopr-
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Projections
        run: |
          if [ "${{ inputs.backtest }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            python -m nbamodel.pipeline --backtest
          else
            python -m nbamodel.pipeline
          fi
      - name: College projections
        run: |
          m=$(date -u +%-m)
          if [ "$m" -ge 5 ] && [ "$m" -le 10 ]; then echo "college off-season"; exit 0; fi
          if [ "${{ inputs.backtest }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            python -m cbbmodel.backtest
            python -m cbbmodel.players
          fi
          python -m cbbmodel.pipeline
      - name: Opening-line test (Mondays)
        if: ${{ inputs.backtest || github.event_name == 'schedule' }}
        run: |
          if [ "${{ inputs.backtest }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then python -m nbamodel.openers; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Board update ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
