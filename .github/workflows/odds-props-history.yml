name: Odds API past props pull

# Pull of past NBA player props for the props backtest. Runs on demand only, with the markets and
# credit cap Ryan approved; resumes where it stopped and commits the CSV to the branch it ran on.
on:
  workflow_dispatch:
    inputs:
      markets:
        description: "Comma-separated Odds API prop markets"
        default: "player_points"
      max_credits:
        description: "Stop before using more than this many credits"
        default: "1600"

permissions:
  contents: write

concurrency:
  group: odds-props-history
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m oddsapi.prop_history
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PROP_MARKETS: ${{ inputs.markets }}
          MAX_CREDITS: ${{ inputs.max_credits }}
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/odds
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Past NBA player props from the Odds API"
          git push
