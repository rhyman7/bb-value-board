name: NBA pre-tip updates

# Every 30 minutes from about 4 PM to 11 PM New York time on NBA nights: re-read the injury report,
# update the model's number for games tipping within 3.5 hours, and log it with the line (Odds API,
# 1 credit every run, Pinnacle plus nine US books: about 400 credits a month). The same read flags
# US-book spreads that beat Pinnacle's fair price (nbamodel/sharp.py).
# Approved by Ryan on 2026-11-18.
# GitHub's scheduler is unreliable for this: on Nov 18 only 2 of 16 short cron starts fired, and on
# Nov 19 the evening start never came and the late one was an hour late. So the loop starts when the
# late-afternoon board update finishes (workflow_run is reliable) and re-checks every 30 minutes until
# 11:30 PM ET, kept under GitHub's 6-hour job limit. The late cron stays as a backup.
on:
  workflow_run:
    workflows: ["Update NBA and college boards"]
    types: [completed]
  schedule:
    - cron: "50 0 * 10-12,1-6 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pretip
  cancel-in-progress: false

jobs:
  pretip:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: hoopr-${{ github.run_id }}
          restore-keys: hoopr-
      - run: pip install -r requirements.txt
      - name: Pre-tip updates every 30 minutes until the end time
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          h=$(date -u +%-H)
          # the 11 AM ET board update also triggers this: nothing tips for hours, so wait for the 5 PM one
          if [ "$h" -ge 12 ] && [ "$h" -lt 20 ]; then echo "too early for pre-tip updates"; exit 0; fi
          # run to 04:30 UTC (11:30 PM ET), at most 5 h 40 min (GitHub stops jobs at 6 h)
          if [ "$h" -ge 12 ]; then stop=$(date -u -d "tomorrow 04:30" +%s); else stop=$(date -u -d "today 04:30" +%s); fi
          cap=$(( $(date -u +%s) + 340 * 60 )); [ "$stop" -gt "$cap" ] && stop=$cap
          while [ "$(date -u +%s)" -lt "$stop" ]; do
            git pull -q --rebase origin main || true      # the board update may have changed the feed
            python -m nbamodel.pretip || echo "pre-tip run failed"
            for f in docs/lines/nba_pretip.csv docs/lines/nba_sharp.csv docs/nba/sharp.json; do git add "$f" 2>/dev/null || true; done
            if ! git diff --staged --quiet; then
              git commit -q -m "Pre-tip update ($(date -u +%Y-%m-%dT%H:%MZ))"
              for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 10; done
            fi
            m=$(date -u +%-M); s=$(date -u +%-S)
            if [ "$m" -lt 7 ]; then wait=$(( (7 - m) * 60 - s )); elif [ "$m" -lt 37 ]; then wait=$(( (37 - m) * 60 - s )); else wait=$(( (67 - m) * 60 - s )); fi
            sleep "$wait"
          done
